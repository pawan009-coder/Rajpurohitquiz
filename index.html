<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJPUROHIT - Supreme Quiz</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --gold: #FFD700;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Supreme 3D Background */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%);
            z-index: -1;
        }

        /* Splash Screen Animation */
        #splash-screen {
            background: #000;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .rajpurohit-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), #fff, var(--neon-pink));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        .neon-border {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            border: 1px solid var(--neon-blue);
        }

        /* Nav Center Button 3D */
        .nav-center {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-25px);
            box-shadow: 0 10px 20px rgba(188, 19, 254, 0.4);
            border: 3px solid #000;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div id="splash-screen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center">
        <h1 class="rajpurohit-text">RAJPUROHIT</h1>
        <p class="text-gray-400 tracking-[0.4em] uppercase text-xs mt-4">By Pawan and Bharat</p>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[90] flex items-center justify-center hidden">
        <div class="glass p-10 w-11/12 max-w-md text-center">
            <h2 class="font-brand text-2xl mb-8">Sign In</h2>
            <button id="login-btn" class="w-full bg-white text-black font-bold py-4 rounded-2xl flex items-center justify-center gap-3 shadow-lg">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
                Login with Google
            </button>
        </div>
    </div>

    <div id="app-container" class="fixed inset-0 flex flex-col hidden">
        <header class="p-5 flex justify-between items-center glass m-4">
            <div id="admin-trigger" class="cursor-pointer">
                <h2 class="font-bold text-xl text-gradient">RAJPUROHIT</h2>
                <span id="admin-tag" class="text-[10px] bg-red-600 px-1 rounded hidden animate-pulse">ADMIN</span>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right"><p id="score-display" class="font-bold text-cyan-400">0 XP</p></div>
                <img id="user-avatar" class="w-10 h-10 rounded-full border-2 border-pink-500">
            </div>
        </header>

        <main class="flex-1 overflow-y-auto px-6 pb-28">
            <section id="home-view" class="space-y-6">
                <div class="glass p-6">
                    <h3 class="text-xl font-bold">Welcome, <span id="user-name" class="text-pink-500">User</span></h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass p-4 text-center"><p class="text-xs text-gray-400">GLOBAL RANK</p><h4 id="rank-val">#--</h4></div>
                    <div class="glass p-4 text-center"><p class="text-xs text-gray-400">SCORE</p><h4 id="score-val">0</h4></div>
                </div>
            </section>

            <section id="rank-view" class="hidden">
                <h3 class="text-center font-bold text-xl mb-4">Global Rank</h3>
                <div id="leaderboard" class="space-y-3"></div>
            </section>

            <section id="quiz-view" class="hidden">
                <div id="class-select" class="grid gap-4">
                    <button onclick="startQuizFlow('12')" class="glass p-8 text-xl font-bold">Class 12</button>
                    <button onclick="startQuizFlow('10')" class="glass p-8 text-xl font-bold">Class 10</button>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 h-20 glass flex justify-around items-center px-2">
            <button onclick="switchTab('home-view')" class="flex flex-col items-center text-cyan-400"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
            <button onclick="switchTab('rank-view')" class="flex flex-col items-center text-gray-400"><i class="fas fa-trophy"></i><span class="text-[10px]">Rank</span></button>
            <button onclick="switchTab('quiz-view')" class="nav-center"><i class="fas fa-play text-2xl"></i></button>
            <button onclick="switchTab('profile-view')" class="flex flex-col items-center text-gray-400"><i class="fas fa-user"></i><span class="text-[10px]">Me</span></button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOHPevaiVZWoDuxpp0L89a9kMAH6nV4IM",
            authDomain: "rajpurohit-bf36c.firebaseapp.com",
            projectId: "rajpurohit-bf36c",
            storageBucket: "rajpurohit-bf36c.firebasestorage.app",
            messagingSenderId: "765326201462",
            appId: "1:765326201462:web:a06b47ff3ae131a87d4557",
            measurementId: "G-H29TJ7PFC9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // SPLASH LOGIC
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            splash.style.transform = 'translateY(-100%)';
            setTimeout(() => {
                splash.classList.add('hidden');
                checkAuthState();
            }, 800);
        }, 3000);

        function checkAuthState() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    setupUserData(user);
                } else {
                    document.getElementById('auth-screen').classList.remove('hidden');
                }
            });
        }

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

        async function setupUserData(user) {
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-avatar').src = user.photoURL;
            if(user.email === "nagtakanwarpkd@gmail.com") {
                window.isAdmin = true; // Admin Flag
            }
        }

        window.switchTab = (id) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };

        // ADMIN TRIGGER
        let clicks = 0;
        document.getElementById('admin-trigger').onclick = () => {
            clicks++;
            if(clicks === 5 && window.isAdmin) {
                document.getElementById('admin-tag').classList.remove('hidden');
                alert("Admin Access Activated");
            }
        };
    </script>
</body>
                </html>
