<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>RAJPUROHIT - Quiz App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- आप अपने CSS लिंक यहाँ जोड़ेंगे -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- मुख्य शीर्षक -->
    <header>
        <h1 class="title">
            <span class="stylish-text">RAJPUROHIT</span> <br>
            <span class="subtitle">BY PAWAN AND BHARAT</span>
        </h1>
        <!-- admin mode toggle button (hidden by default) -->
        <button id="adminBtn" style="display:none;">Admin Mode</button>
    </header>

    <!-- नेविगेशन menu -->
    <nav class="menu">
        <button onclick="showPage('home')">होम</button>
        <button onclick="showPage('globalRank')">ग्लोबल रैंक</button>
        <button onclick="showPage('quiz')">क्विज़</button>
        <button onclick="showPage('userData')">यूज़र डेटा</button>
    </nav>

    <!-- मुख्य कंटेंट सेक्शन -->
    <main>
        <!-- होम पेज -->
        <section id="home" class="page">
            <h2>होम</h2>
            <div class="stats">
                <div>ग्लोबल रैंक</div>
                <div>आपका स्कोर</div>
                <div>अटेंड किए गए क्विज़</div>
                <div>अनएटेंड क्विज़</div>
            </div>
            <div class="top-rankings">
                <h3>शीर्ष रैंकिंग</h3>
                <div>पहला: <span class="crown">👑</span></div>
                <div>दूसरा</div>
                <div>तीसरा</div>
            </div>
        </section>

        <!-- ग्लोबल रैंक पेज -->
        <section id="globalRank" class="page" style="display:none;">
            <h2>ग्लोबल रैंक</h2>
            <!-- रैंकिंग लिस्ट यहाँ दिखेगी -->
        </section>

        <!-- क्विज़ पेज -->
        <section id="quiz" class="page" style="display:none;">
            <h2>क्विज़</h2>
            <div>
                <button onclick="selectQuizType(12)">12 का क्विज़</button>
                <button onclick="selectQuizType(10)">10 का क्विज़</button>
            </div>
            <!-- क्विज़ कंटेंट यहाँ आएगा -->
        </section>

        <!-- यूज़र डेटा पेज -->
        <section id="userData" class="page" style="display:none;">
            <h2>अपना प्रोफ़ाइल</h2>
            <form id="userForm">
                <label>अपनी तस्वीर अपलोड करें:</label>
                <input type="file" id="profilePic" accept="image/*"><br>
                <label>नाम:</label>
                <input type="text" id="name"><br>
                <label>Gmail:</label>
                <input type="email" id="email" value="nagtakanwarpkd@gmail.com" readonly><br>
                <button type="submit">अपडेट करें</button>
            </form>
            <div id="userStats">
                <!-- यूज़र का स्कोर दिखेगा -->
            </div>
        </section>
    </main>

    <!-- बुनियादी CSS और JS फ़ाइलें -->
    <script src="script.js"></script>
</body>
          </html>
