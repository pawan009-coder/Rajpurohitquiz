<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJPUROHIT - The Ultimate Quiz</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'brand': ['Orbitron', 'sans-serif'],
                        'body': ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'raj-gold': '#FFD700',
                        'raj-neon': '#00f3ff',
                        'raj-pink': '#bc13fe',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-body h-screen w-screen relative overflow-hidden bg-black text-white">

    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-1000">
        <h1 class="font-brand text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-raj-neon via-purple-500 to-raj-pink tracking-widest animate-pulse drop-shadow-lg text-center px-4">
            RAJPUROHIT
        </h1>
        <div class="mt-4 text-gray-400 text-[0.6rem] tracking-[0.4em] uppercase font-bold">
            By Pawan and Bharat
        </div>
        <div class="mt-10 w-20 h-1 bg-gray-800 rounded-full overflow-hidden">
            <div class="h-full bg-raj-neon w-1/2 animate-bounce"></div>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-40 flex flex-col items-center justify-center hidden bg-black/90 backdrop-blur-md">
        <div class="glass-panel p-8 w-11/12 max-w-md text-center border border-white/10">
            <h2 class="font-brand text-2xl mb-2 text-raj-neon">IDENTITY VERIFICATION</h2>
            <p class="text-gray-400 mb-8 text-xs uppercase tracking-widest">Access the Supreme Realm</p>
            
            <button id="google-login-btn" class="w-full bg-white text-black font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-3 hover:bg-raj-neon transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6" alt="G">
                SIGN IN WITH GOOGLE
            </button>
        </div>
    </div>

    <div id="app-container" class="w-full h-full flex flex-col relative hidden">
        
        <header class="flex justify-between items-center p-4 glass-panel m-2 rounded-xl z-20 sticky top-0 border border-white/5">
            <div class="flex flex-col">
                <span class="font-brand text-lg font-bold text-gradient tracking-tighter">RAJPUROHIT</span>
            </div>
            
            <button id="admin-main-btn" class="hidden bg-red-600/20 border border-red-500 text-red-500 text-[0.7rem] px-3 py-1 rounded-full font-bold uppercase hover:bg-red-600 hover:text-white transition-all">
                <i class="fas fa-user-shield mr-1"></i> Admin Panel
            </button>

            <div class="flex items-center gap-3">
                <div class="text-right">
                    <p id="header-points" class="text-raj-neon font-bold font-brand text-sm">0 XP</p>
                </div>
                <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-raj-pink">
                    <img id="header-user-img" src="https://via.placeholder.com/150" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto pb-24 px-4">
            
            <section id="view-home" class="space-y-4 pt-2">
                <div class="glass-panel p-5">
                    <h2 class="text-xl font-bold">Welcome, <span id="user-name-display" class="text-raj-pink">User</span></h2>
                    <p class="text-gray-400 text-xs">Your progress is being synced...</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="glass-panel p-4 text-center">
                        <p class="text-gray-500 text-[0.6rem] uppercase mb-1">Rank</p>
                        <h3 class="text-lg font-bold" id="stat-rank">#--</h3>
                    </div>
                    <div class="glass-panel p-4 text-center">
                        <p class="text-gray-500 text-[0.6rem] uppercase mb-1">Score</p>
                        <h3 class="text-lg font-bold" id="stat-score">0</h3>
                    </div>
                </div>

                <div id="admin-view" class="hidden space-y-4 animate-fade-in pb-10">
                    <h2 class="font-brand text-red-500 text-xl border-b border-red-900 pb-2 mt-6">Supreme Control Panel</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="adminResetLeaderboard()" class="bg-red-900/30 border border-red-700 p-3 rounded-lg text-[0.7rem] font-bold">RESET LEADERBOARD</button>
                        <button onclick="adminManageUsers()" class="bg-blue-900/30 border border-blue-700 p-3 rounded-lg text-[0.7rem] font-bold">MANAGE USERS</button>
                        <button onclick="adminAddTemporaryAdmin()" class="bg-purple-900/30 border border-purple-700 p-3 rounded-lg text-[0.7rem] font-bold">ADD TEMP ADMIN</button>
                        <button onclick="switchTab('view-quiz')" class="bg-green-900/30 border border-green-700 p-3 rounded-lg text-[0.7rem] font-bold">EDIT QUESTIONS</button>
                    </div>
                </div>
            </section>

            <section id="view-rank" class="hidden space-y-4">
                <h2 class="font-brand text-xl text-center my-4 text-raj-gold">Global Leaderboard</h2>
                <div id="leaderboard-list" class="space-y-2">
                    </div>
            </section>

            <section id="view-quiz" class="hidden h-full">
                <div id="quiz-class-select" class="space-y-4">
                    <h2 class="font-brand text-xl mb-4">Select Class</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="startQuizFlow('12')" class="glass-panel p-5 text-left border-l-4 border-raj-neon">
                            <h3 class="font-bold">Class 12</h3>
                            <p class="text-[0.6rem] text-gray-500">Science & Commerce</p>
                        </button>
                        <button onclick="startQuizFlow('10')" class="glass-panel p-5 text-left border-l-4 border-raj-pink">
                            <h3 class="font-bold">Class 10</h3>
                            <p class="text-[0.6rem] text-gray-500">Board Exams Preparation</p>
                        </button>
                    </div>
                </div>

                <div id="quiz-interface" class="hidden flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-xs font-bold text-raj-neon" id="quiz-timer">TIME: 30s</span>
                        <span class="text-xs font-bold text-gray-500" id="quiz-progress">0/0</span>
                    </div>
                    <div class="glass-panel p-6 mb-4 min-h-[120px] flex items-center justify-center border border-raj-neon/20">
                        <h3 class="text-lg font-bold text-center" id="question-text">Loading...</h3>
                    </div>
                    <div id="options-container" class="grid gap-2"></div>
                </div>
            </section>

            <section id="view-profile" class="hidden flex flex-col items-center">
                <div class="w-24 h-24 rounded-full border-4 border-raj-neon p-1 mb-4">
                    <img id="profile-img-lg" src="" class="w-full h-full rounded-full object-cover">
                </div>
                <h2 class="text-xl font-bold font-brand" id="profile-name">Name</h2>
                <p class="text-gray-500 text-xs mb-6" id="profile-email">email</p>
                <button id="btn-logout" class="text-red-500 font-bold text-[0.7rem] uppercase border border-red-500 px-6 py-2 rounded-full">Logout Account</button>
            </section>

        </main>

        <nav class="glass-panel fixed bottom-4 left-4 right-4 h-16 flex justify-around items-center z-50 border border-white/10">
            <button onclick="switchTab('view-home')" class="nav-btn text-raj-neon flex flex-col items-center">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[0.5rem] uppercase mt-1">Home</span>
            </button>
            <button onclick="switchTab('view-rank')" class="nav-btn text-gray-500 flex flex-col items-center">
                <i class="fas fa-chart-bar text-lg"></i>
                <span class="text-[0.5rem] uppercase mt-1">Rank</span>
            </button>
            <div class="relative -top-5">
                <button onclick="switchTab('view-quiz')" class="w-14 h-14 bg-gradient-to-tr from-raj-neon to-raj-pink rounded-full flex items-center justify-center shadow-lg shadow-raj-pink/20">
                    <i class="fas fa-play text-white"></i>
                </button>
            </div>
            <button onclick="switchTab('view-quiz')" class="nav-btn text-gray-500 flex flex-col items-center">
                <i class="fas fa-book text-lg"></i>
                <span class="text-[0.5rem] uppercase mt-1">Quiz</span>
            </button>
            <button onclick="switchTab('view-profile')" class="nav-btn text-gray-500 flex flex-col items-center">
                <i class="fas fa-user text-lg"></i>
                <span class="text-[0.5rem] uppercase mt-1">Me</span>
            </button>
        </nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="app.js"></script>
</body>
                </html>
