<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAJPUROHIT - The Ultimate Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        brand: ['Orbitron', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'raj-gold': '#FFD700',
                        'raj-neon': '#00f3ff',
                        'raj-pink': '#bc13fe',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-panel {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
        }
    </style>
</head>

<body class="bg-black text-white overflow-hidden">

<!-- ================= HEADER ================= -->
<header class="flex justify-between items-center p-4 glass-panel m-2 rounded-xl sticky top-0 z-50">

    <!-- LOGO (FIXED SIZE) -->
    <div class="font-brand text-xl tracking-wider truncate max-w-[180px]">
        RAJPUROHIT
    </div>

    <!-- ADMIN BADGE + BUTTON -->
    <div class="flex items-center gap-2">
        <span id="admin-badge"
              class="hidden bg-red-600 text-white text-xs px-2 py-1 rounded font-bold">
            ADMIN
        </span>

        <button id="admin-toggle-btn"
                class="hidden bg-red-700 text-white text-xs px-3 py-1 rounded font-bold">
            Enable Admin
        </button>
    </div>

    <!-- USER -->
    <div class="flex items-center gap-2">
        <img id="user-photo" class="w-8 h-8 rounded-full hidden">
        <span id="user-name" class="text-sm"></span>
    </div>
</header>

<!-- ================= MAIN ================= -->
<main id="main-content" class="flex-1 overflow-y-auto pb-24 px-4 pt-2">

    <!-- ================= HOME ================= -->
    <section id="view-home" class="space-y-6">

        <div class="glass-panel p-4 text-center">
            <h2 class="font-brand text-lg text-raj-neon">Welcome to Rajpurohit Quiz</h2>
            <p class="text-sm opacity-80 mt-2">Test your knowledge & climb the leaderboard</p>
        </div>

        <!-- ADMIN DASHBOARD ENTRY -->
        <button id="admin-panel-entry"
                class="hidden w-full bg-red-600 p-3 rounded-xl font-bold">
            ADMIN DASHBOARD
        </button>

    </section>

    <!-- ================= ADMIN DASHBOARD ================= -->
    <section id="admin-dashboard" class="hidden space-y-4">

        <h2 class="font-brand text-xl text-red-500">Admin Dashboard</h2>

        <!-- ADD QUESTION -->
        <div class="glass-panel p-4 space-y-2">
            <h3 class="font-bold">Add Question</h3>

            <select id="admin-class" class="w-full p-2 bg-black border rounded">
                <option value="10">Class 10</option>
                <option value="12">Class 12</option>
            </select>

            <input id="admin-question" class="w-full p-2 bg-black border rounded" placeholder="Question text">
            <input id="opt1" class="w-full p-2 bg-black border rounded" placeholder="Option 1">
            <input id="opt2" class="w-full p-2 bg-black border rounded" placeholder="Option 2">
            <input id="opt3" class="w-full p-2 bg-black border rounded" placeholder="Option 3">
            <input id="opt4" class="w-full p-2 bg-black border rounded" placeholder="Option 4">
            <input id="correct-opt" type="number" class="w-full p-2 bg-black border rounded" placeholder="Correct option (0-3)">

            <button onclick="addQuestionAdmin()" class="w-full bg-green-600 p-2 rounded">
                Add Question
            </button>
        </div>

        <!-- DELETE QUESTION -->
        <div class="glass-panel p-4 space-y-2">
            <h3 class="font-bold">Delete Question</h3>
            <input id="delete-question-id" class="w-full p-2 bg-black border rounded" placeholder="Question Doc ID">
            <button onclick="deleteQuestionAdmin()" class="w-full bg-red-700 p-2 rounded">
                Delete Question
            </button>
        </div>

        <!-- USER CONTROL -->
        <div class="glass-panel p-4 space-y-2">
            <h3 class="font-bold">User Control</h3>
            <input id="user-uid" class="w-full p-2 bg-black border rounded" placeholder="User UID">
            <input id="user-score" type="number" class="w-full p-2 bg-black border rounded" placeholder="New Score">
            <button onclick="updateUserScoreAdmin()" class="w-full bg-blue-600 p-2 rounded">
                Update Score
            </button>
        </div>

        <!-- ADMIN CONTROL -->
        <div class="glass-panel p-4 space-y-2">
            <h3 class="font-bold">Temporary Admin Control</h3>
            <input id="admin-email" class="w-full p-2 bg-black border rounded" placeholder="Gmail address">
            <button onclick="addTempAdmin()" class="w-full bg-purple-600 p-2 rounded">
                Make Admin
            </button>
            <button onclick="removeTempAdmin()" class="w-full bg-gray-600 p-2 rounded">
                Remove Admin
            </button>
        </div>

        <!-- RESET -->
        <button onclick="resetLeaderboardAdmin()"
                class="w-full bg-yellow-600 p-3 rounded-xl font-bold text-black">
            Reset Leaderboard
        </button>

    </section>

    <!-- ================= RANK ================= -->
    <section id="view-rank" class="hidden space-y-4">
        <!-- existing leaderboard -->
    </section>

</main>

<script type="module" src="./app.js"></script>
</body>
</html>
