<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAJPUROHIT Quiz App</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}
body{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== Splash / Login ===== */
#loginScreen{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#1e3c72,#2a5298);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.app-title{
  font-size:3rem;            /* FIXED SIZE */
  font-weight:800;
  letter-spacing:4px;
  text-shadow:0 10px 30px rgba(0,0,0,.6);
  transform:perspective(600px) rotateX(10deg);
}
.app-sub{
  margin-top:10px;
  opacity:.85;
  letter-spacing:2px;
}
.login-btn{
  margin-top:40px;
  padding:14px 28px;
  border:none;
  border-radius:30px;
  background:#fff;
  color:#000;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* ===== Main App ===== */
#app{
  display:none;
  padding-bottom:90px;
}

/* Header */
header{
  padding:20px;
  text-align:center;
}
header h1{
  font-size:2.2rem;     /* RESPONSIVE */
  letter-spacing:3px;
}
header small{
  opacity:.8;
}

/* Admin Button */
#adminBtn{
  position:fixed;
  top:15px;
  right:15px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  backdrop-filter:blur(8px);
  display:none;
}

/* Cards */
.card{
  margin:16px;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  transform:perspective(800px) rotateX(2deg);
}

/* Rank Crown */
.crown{
  color:gold;
  margin-left:6px;
}

/* Bottom Nav */
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}
nav button{
  background:none;
  border:none;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}
nav i{
  font-size:22px;
  display:block;
}

/* Sections */
.section{display:none;}
.section.active{display:block;}

</style>
</head>

<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
  <div class="app-title">RAJPUROHIT</div>
  <div class="app-sub">BY PAWAN AND BHARAT</div>
  <button class="login-btn" onclick="googleLogin()">
    <i class="fa-brands fa-google"></i> Sign in with Google
  </button>
</div>

<!-- ===== ADMIN BUTTON ===== -->
<button id="adminBtn" onclick="toggleAdmin()">ADMIN MODE</button>

<!-- ===== APP ===== -->
<div id="app">

<header>
  <h1>RAJPUROHIT</h1>
  <small>BY PAWAN AND BHARAT</small>
</header>

<!-- HOME -->
<div id="home" class="section active">
  <div class="card">🌍 Global Rank: <b>#--</b></div>
  <div class="card">🎯 Your Score: <b>0</b></div>
  <div class="card">✅ Attended Quizzes: <b>0</b></div>
  <div class="card">❌ Unattended Quizzes: <b>0</b></div>
</div>

<!-- RANK -->
<div id="rank" class="section">
  <div class="card">
    #1 Username <i class="fa-solid fa-crown crown"></i>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="section">
  <div class="card">
    <h3>Select Class</h3>
    <button>Class 10</button>
    <button>Class 12</button>
  </div>
</div>

<!-- ME -->
<div id="me" class="section">
  <div class="card">
    <h3>Your Profile</h3>
    <p>Email: <span id="userEmail"></span></p>
  </div>
</div>

</div>

<!-- ===== BOTTOM NAV ===== -->
<nav>
  <button onclick="showSection('home')"><i class="fa-solid fa-house"></i>Home</button>
  <button onclick="showSection('rank')"><i class="fa-solid fa-trophy"></i>Rank</button>
  <button onclick="showSection('quiz')"><i class="fa-solid fa-book"></i>Quiz</button>
  <button onclick="showSection('me')"><i class="fa-solid fa-user"></i>Me</button>
</nav>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOHPevaiVZWoDuxpp0L89a9kMAH6nV4IM",
  authDomain: "rajpurohit-bf36c.firebaseapp.com",
  projectId: "rajpurohit-bf36c",
  storageBucket: "rajpurohit-bf36c.firebasestorage.app",
  messagingSenderId: "765326201462",
  appId: "1:765326201462:web:a06b47ff3ae131a87d4557",
  measurementId: "G-H29TJ7PFC9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
getFirestore(app);

const ADMIN_EMAIL = "nagtakanwarpkd@gmail.com";

window.googleLogin = async () =>{
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("userEmail").innerText=user.email;
    if(user.email===ADMIN_EMAIL){
      document.getElementById("adminBtn").style.display="block";
    }
  }
});

window.toggleAdmin = ()=>{
  alert("Admin Mode Enabled (Dashboard next file)");
};

window.showSection = (id)=>{
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};
</script>

</body>
</html>
